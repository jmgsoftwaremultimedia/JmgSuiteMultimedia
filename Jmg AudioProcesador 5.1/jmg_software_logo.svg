<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34a853" />
      <stop offset="50%" stop-color="#1e7e34" />
      <stop offset="100%" stop-color="#0f401b" />
    </linearGradient>

    <!-- Text & Icon 3D Gradient -->
    <linearGradient id="green3D" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5cd67d" />
      <stop offset="30%" stop-color="#2ebd59" />
      <stop offset="70%" stop-color="#1b8a3e" />
      <stop offset="100%" stop-color="#0f5223" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Subtle Button Inner Shadow -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Clean Background Canvas -->
  <rect width="1000" height="500" fill="#ffffff" />

  <!-- Outer Button Structure -->
  <g filter="url(#dropShadow)">
    <!-- Metallic Green Outer Frame -->
    <rect x="80" y="70" width="840" height="360" rx="30" ry="30" fill="url(#borderGrad)" />
    
    <!-- White Inner Body of the Button -->
    <rect x="95" y="85" width="810" height="330" rx="20" ry="20" fill="#ffffff" filter="url(#innerShadow)" />
  </g>

  <!-- LOGO GRAPHIC: Computer/Monitor Stack (Left Side) -->
  <g transform="translate(140, 130)" filter="url(#dropShadow)">
    <!-- Computer Tower -->
    <rect x="145" y="50" width="55" height="150" rx="8" fill="url(#green3D)" />
    <line x1="155" y1="75" x2="190" y2="75" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <line x1="155" y1="87" x2="190" y2="87" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
    <circle cx="172" cy="170" r="5" fill="#ffffff" />

    <!-- Monitor Frame Perspective/Curved -->
    <path d="M 10 30 Q 75 15 140 30 L 140 150 Q 75 165 10 150 Z" fill="url(#green3D)" />
    <!-- Inner Screen Area -->
    <path d="M 18 38 Q 75 25 132 38 L 132 142 Q 75 155 18 142 Z" fill="#ffffff" />
    
    <!-- Circuit Lines Inside Screen -->
    <g stroke="url(#green3D)" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M 40 120 L 40 80 Q 40 60 60 60 L 75 60" />
      <circle cx="75" cy="60" r="3" fill="url(#green3D)" />
      
      <path d="M 75 125 L 75 90 L 95 75" />
      <circle cx="95" cy="75" r="3" fill="url(#green3D)" />

      <path d="M 110 115 L 110 95 Q 110 80 95 65" />
      <circle cx="95" cy="65" r="3" fill="url(#green3D)" />
    </g>

    <!-- Monitor Stand -->
    <path d="M 60 153 L 90 153 L 100 185 L 50 185 Z" fill="url(#green3D)" />
    <ellipse cx="75" cy="188" rx="40" ry="12" fill="url(#green3D)" />

    <!-- Keyboard -->
    <polygon points="30,195 130,195 145,225 15,225" fill="url(#green3D)" />
    <!-- Keyboard details (fake key rows) -->
    <line x1="35" y1="205" x2="125" y2="205" stroke="#ffffff" stroke-width="3" />
    <line x1="28" y1="215" x2="132" y2="215" stroke="#ffffff" stroke-width="3" />

    <!-- Mouse -->
    <ellipse cx="175" cy="215" rx="15" ry="10" fill="url(#green3D)" />
  </g>

  <!-- TYPOGRAPHY: Jmg Software (Right Side) -->
  <g transform="translate(430, 0)" filter="url(#dropShadow)">
    <!-- "Jmg" Text Base with 3D feel simulated by font styling -->
    <text x="0" y="270" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="145" fill="url(#green3D)" letter-spacing="-2">Jmg</text>
    <!-- "Software" Text Base -->
    <text x="3" y="365" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="75" fill="url(#green3D)" letter-spacing="0">Software</text>
  </g>
</svg>
